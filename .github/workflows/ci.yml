name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @travelpad/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm check:structure
      - run: pnpm test
      - run: pnpm build
        env: { API_INTERNAL_URL: http://localhost:4000/v1 }

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t travelpad-api .
      - run: docker build -f apps/web/Dockerfile -t travelpad-web .
